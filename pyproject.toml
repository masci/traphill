[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traphill"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3.205",
    "opencv-python>=4.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1.7",
    "lap>=0.5.12",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
traphill = "traphill.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/traphill"]

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
